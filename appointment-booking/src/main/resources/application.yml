server:
  port: 8081

spring:
  application:
    name: appointment-booking

  datasource:
    url: jdbc:mysql://localhost:3306/appointment_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
